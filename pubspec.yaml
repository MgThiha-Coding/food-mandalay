name: mandalar_x
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_launcher_icons: ^0.14.4
  cupertino_icons: ^1.0.8
  line_icons: ^2.0.3
  supabase_flutter: ^2.10.3
  flutter_riverpod: ^2.3.7
  animations: ^2.1.1
  image_picker: ^1.2.1
  dotted_border: ^3.1.0
  shared_preferences: ^2.5.3
  lottie: ^3.3.2
  carousel_slider: ^5.1.1
  fluttertoast: ^9.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  geocoding: ^4.0.0
  permission_handler: ^12.0.1
  google_fonts: ^6.3.3
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.2
  http: ^1.6.0
  pincode_input_fields: ^1.0.3
  google_sign_in: ^7.2.0
  onesignal_flutter: ^5.1.2
  firebase_core: ^4.3.0
  shorebird_code_push: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_logo.jpg"

flutter:
  uses-material-design: true

  assets:
    - assets/images/google.png
    - assets/images/person.png
    - assets/images/mandalarxloading.png
    - assets/images/skuta.png
    - assets/images/pizza.png
    - assets/images/ramen.jpg
    - assets/images/pick_location.jpg
    - assets/fonts/
    - assets/translations/
    - assets/images/app_logo.jpg
    - assets/images/empty_image.png
    - shorebird.yaml

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
